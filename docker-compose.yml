services:
  postgres:
    image: paradedb/paradedb:v0.25.9
    environment:
      POSTGRES_DB: shariah
      POSTGRES_USER: shariah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shariah}
    volumes:
      - paradedb_data:/var/lib/postgresql
      - ./src/backend/app/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shariah -d shariah"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    networks: [shariah_private]

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://shariah:${POSTGRES_PASSWORD:-shariah}@postgres:5432/shariah
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      BASE_URL: ${BASE_URL:-}
      API_KEY: ${API_KEY:-}
      MODEL: ${MODEL:-claude-opus-5}
      COPILOT_TIMEOUT_SECONDS: ${COPILOT_TIMEOUT_SECONDS:-180}
      AAOIFI_STANDARDS_PDF: /data/Shariaa-Standards-ENG.pdf
    volumes:
      - ./src/backend/app:/app/app:ro
      - ./data/Shariaa-Standards-ENG.pdf:/data/Shariaa-Standards-ENG.pdf:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks: [shariah_private]

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    networks: [shariah_private]

networks:
  shariah_private:
    driver: bridge

volumes:
  paradedb_data:
  frontend_node_modules:
